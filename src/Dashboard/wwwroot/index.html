<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Health dashboard</title>
  <base href="/" />
  <link rel="preload" id="webassembly" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="css/app.css" />
  <script type="importmap"></script>
</head>

<body>
  <header class="topbar">
    <a class="topbar__brand" href="https://www.clear-measure.com/" target="_blank" rel="noopener" title="Clear Measure (opens in a new tab)">
      <img src="clear-measure-logo-white.png" alt="Clear Measure" width="160" height="40" />
    </a>
    <span class="topbar__space">Health dashboard</span>
  </header>
  <div id="app">
    <p class="app-loading" role="status">Loading the health dashboard</p>
  </div>

  <div id="blazor-error-ui" role="alert">
    The dashboard stopped with an error.
    <a href="." class="reload">Reload</a>
    <span class="dismiss" aria-hidden="true">&times;</span>
  </div>
  <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
